<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Suivre ma demande – Forces de Police Nationale (FPN)</title>
<meta name="theme-color" content="#0A1B33"><meta name="color-scheme" content="only light">
<link rel="icon" href="assets/img/favicon.png" type="image/png">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/site.css">
</head>
<body data-page="suivi" data-title="Suivre ma demande">
<main>
<section class="phero"><div class="wrap"><div class="crumbs"><a href="index.html">Accueil</a> › <a href="demarches.html">Mes démarches</a> › Suivi</div><h1><span class="ph-ic" data-i="search"></span>Suivre ma demande</h1><p>Entrez le numéro reçu lors de votre démarche pour voir où en est votre dossier, étape par étape.</p></div></section>
<section class="s" style="padding-top:36px"><div class="wrap" style="max-width:820px">
 <form class="card form" id="f" style="margin-bottom:22px"><div class="fld"><label for="n">Numéro de suivi</label><input id="n" placeholder="FPN-2026-00128" autocomplete="off" style="font-family:var(--head);font-size:1.15rem;letter-spacing:.05em;text-transform:uppercase"></div><button class="btn navy block">Rechercher</button><small style="color:var(--muted)">Démonstration : essayez <a href="#" id="ex" style="color:var(--blue);font-weight:700">FPN-2026-00128</a>.</small></form>
 <div id="res"></div>
</div></section>
</main>
<script src="assets/js/store.js"></script>
<script src="assets/js/layout.js"></script>
<script>
const $=id=>document.getElementById(id);
function render(r){
  if(!r){$('res').innerHTML='<div class="warn"><b>Aucun dossier trouvé.</b> Vérifiez le numéro (format FPN-2026-00000) ou contactez le commissariat concerné.</div>';return}
  const idx=FPN.STATUTS.findIndex(s=>s.k===r.status);const st=FPN.statut(r.status);
  const steps=FPN.STATUTS.map((s,i)=>{const ev=r.timeline.filter(t=>t.status===s.k).pop();return `<li class="${i<idx?'ok':i===idx?(idx===3?'ok':'now'):'todo'}"><b>${s.l}</b><span>${ev?FPN.fmt(ev.at)+' — '+FPN.esc(ev.text):'En attente'}</span></li>`}).join('');
  $('res').innerHTML=`<div class="card"><div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:6px"><div><small style="color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.08em">${FPN.TYPES[r.type]}</small><h2 style="font-size:1.35rem">${FPN.esc(r.subject)}</h2></div><span class="pill ${st.c}">${st.l}</span></div>
  <p style="color:var(--muted);font-size:.92rem;margin-bottom:22px">N° <b>${r.id}</b> · déposée le ${FPN.fmt(r.createdAt)} · ${FPN.esc(FPN.commissariat(r.commissariat).nom)}</p>${r.files&&r.files.length?'<p style="margin:0 0 18px;font-size:.9rem;color:var(--muted)">📎 '+r.files.length+' pièce(s) jointe(s) : '+r.files.map(f=>FPN.esc(f.name)).join(', ')+'</p>':''}<ol class="tl">${steps}</ol>
  ${r.status==='cloturee'?'':'<div class="info" style="margin-top:22px">Vous serez prévenu par SMS à chaque changement d’étape (fonction active en production).</div>'}</div>`;
}
$('f').onsubmit=e=>{e.preventDefault();render(FPN.findRequest($('n').value))};
$('ex').onclick=e=>{e.preventDefault();$('n').value='FPN-2026-00128';render(FPN.findRequest('FPN-2026-00128'))};
const q=new URLSearchParams(location.search).get('n');if(q){$('n').value=q;render(FPN.findRequest(q))}
</script>
</body>
</html>
